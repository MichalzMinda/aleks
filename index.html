<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koniec Misji - Licznik</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: var(--primary-color);
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
        }

        h1 { margin-bottom: 1rem; font-size: 1.5rem; }

        /* Stylizacja zdjęcia */
        .photo-container {
            width: 100%;
            height: 300px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #colleague-photo {
            max-width: 100%;
            max-height: 100%;
            border-radius: 10px;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: opacity 0.5s ease;
        }

        /* Licznik */
        #countdown {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--accent-color);
        }

        /* Pasek postępu */
        .progress-container {
            width: 100%;
            background-color: #eee;
            border-radius: 15px;
            height: 30px;
            overflow: hidden;
            position: relative;
            margin-top: 10px;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.1s linear;
        }

        #progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #000;
        }

        .info { font-size: 0.9rem; color: #7f8c8d; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ostatnie chwile w pracy! 🚀</h1>
        
        <div class="photo-container">
            <img id="colleague-photo" src="img/photo1.jpg" alt="Kolega">
        </div>

        <div id="countdown">00:00:00:000</div>

        <div class="progress-container">
            <div id="progress-bar"></div>
            <div id="progress-text">0%</div>
        </div>

        <p class="info">Do 19 grudnia 2025, 15:30:00</p>
    </div>

    <script>
        // KONFIGURACJA
        const targetDate = new Date("December 19, 2025 15:30:00").getTime();
        // Ustaw datę początkową na jakąś datę w przeszłości, aby pasek postępu miał sens
        // Zmieniłem na 15.11.2025, 15:30 - czyli miesiąc do końca
        const startDate = new Date("December 15, 2025 11:15:00").getTime(); 
        
        const photoElement = document.getElementById('colleague-photo');
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // Pamiętamy ostatnią godzinę, dla której zmieniliśmy zdjęcie
        let lastPhotoHour = -1; 
        // Pamiętamy numer losowego zdjęcia, które obecnie wyświetlamy
        let currentPhotoIndex = 1;

        // Funkcja wybierająca losową liczbę całkowitą z zakresu min do max (włącznie)
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function update() {
            const now = new Date();
            const nowTime = now.getTime();
            const distance = targetDate - nowTime;

            if (distance < 0) {
                // Koniec odliczania
                countdownElement.innerHTML = "00:00:00:000";
                progressBar.style.width = "100%";
                progressText.innerHTML = "WOLNOŚĆ!";
                photoElement.src = "img/freedom.jpg"; // opcjonalne zdjęcie na koniec
                return;
            }

            // 1. LICZNIK CZASU
            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            // Milisekundy (pierwsze dwie cyfry)
            const milliseconds = Math.floor((distance % 1000) / 10);

            countdownElement.innerHTML = 
                String(hours).padStart(2, '0') + ":" + 
                String(minutes).padStart(2, '0') + ":" + 
                String(seconds).padStart(2, '0') + ":" + 
                String(milliseconds).padStart(2, '0');

            // 2. PASEK POSTĘPU
            const totalDuration = targetDate - startDate;
            const elapsed = nowTime - startDate;
            let progress = (elapsed / totalDuration) * 100;
            progress = Math.max(0, Math.min(100, progress)); 
            
            progressBar.style.width = progress + "%";
            progressText.innerHTML = progress.toFixed(1) + "%";

            // 3. LOGIKA ZMIANY ZDJĘĆ CO GODZINĘ
            const currentHour = now.getHours();

            // Sprawdzamy, czy przeszła pełna godzina od ostatniej zmiany zdjęcia
            if (currentHour !== lastPhotoHour) {
                // Wybieramy LOSOWE zdjęcie z puli 1-15
                let newPhotoIndex = getRandomInt(1, 15);
                
                // Opcjonalnie: Unikaj dwukrotnego wylosowania tego samego zdjęcia pod rząd
                // while (newPhotoIndex === currentPhotoIndex) {
                //     newPhotoIndex = getRandomInt(1, 15);
                // }

                currentPhotoIndex = newPhotoIndex;
                lastPhotoHour = currentHour;

                // Ustawiamy nowe źródło zdjęcia
                const newSrc = `img/photo${currentPhotoIndex}.jpg`;
                photoElement.style.opacity = '0'; // Płynne wygaszenie
                
                setTimeout(() => {
                    photoElement.src = newSrc;
                    photoElement.style.opacity = '1'; // Płynne pojawienie
                }, 300); // Czekamy 300ms na animację wygaszenia
            }
        }

        // Uruchamiamy funkcję odświeżającą co 50ms dla płynnego licznika
        setInterval(update, 50);
        
        // Wywołaj funkcję raz, aby ustawić początkowe wartości
        update();
    </script>
</body>
</html>
