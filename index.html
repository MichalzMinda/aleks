<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koniec Misji - Licznik</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.04), transparent 25%),
                        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.05), transparent 30%),
                        linear-gradient(180deg, #0b1c3a 0%, #0f274e 45%, #162f5f 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #002360;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 600px;
            position: relative;
            z-index: 2;
        }

        h1 { margin-bottom: 1rem; font-size: 1.5rem; }

        /* Stylizacja zdjęcia */
        .photo-container {
            width: 100%;
            height: 420px;
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #colleague-photo {
            max-width: 100%;
            max-height: 100%;
            border-radius: 14px;
            object-fit: contain; /* nie przycinaj */
            border: 4px solid white;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            transition: opacity 0.5s ease;
        }

        /* Licznik */
        #countdown {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2.5rem;
            font-weight: bold;
            margin: 20px 0;
            color: var(--accent-color);
        }

        /* Pasek postępu */
        .progress-container {
            width: 100%;
            background-color: #eee;
            border-radius: 15px;
            height: 30px;
            overflow: visible;
            position: relative;
            margin-top: 60px;
        }

        #progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            width: 0%;
            transition: width 0.1s linear;
        }

        #progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            font-weight: bold;
            color: #000;
        }

        .progress-avatar {
            position: absolute;
            top: -74px;
            left: 0;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: left 0.1s linear;
            pointer-events: none;
            z-index: 2;
        }

        .progress-avatar img {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.18);
        }

        .progress-avatar::after {
            content: "";
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 9px solid white;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.15));
        }

        .info { font-size: 0.9rem; color: #7f8c8d; margin-top: 15px; }

        /* Śnieg */
        .snow {
            position: fixed;
            inset: -60px 0 0 0;
            pointer-events: none;
            background-repeat: repeat;
            opacity: 0.8;
            z-index: 1;
        }

        .snow.snow--front {
            background-image: radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.95), transparent),
                              radial-gradient(2px 2px at 80px 120px, rgba(255,255,255,0.9), transparent),
                              radial-gradient(3px 3px at 150px 90px, rgba(255,255,255,0.9), transparent);
            background-size: 200px 200px;
            animation: snowFall 12s linear infinite;
        }

        .snow.snow--back {
            background-image: radial-gradient(1.5px 1.5px at 60px 40px, rgba(255,255,255,0.6), transparent),
                              radial-gradient(1.5px 1.5px at 140px 160px, rgba(255,255,255,0.55), transparent),
                              radial-gradient(2px 2px at 10px 190px, rgba(255,255,255,0.55), transparent);
            background-size: 240px 240px;
            animation: snowFall 18s linear infinite;
            filter: blur(1px);
        }

        @keyframes snowFall {
            from { transform: translateY(-40px); }
            to   { transform: translateY(120vh); }
        }

        /* Fajerwerki */
        .fireworks {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1.5;
        }

        .firework {
            position: absolute;
            width: 6px;
            height: 6px;
        }

        .spark {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            animation: sparkFly 1200ms ease-out forwards;
            opacity: 0;
        }

        @keyframes sparkFly {
            0%   { transform: translate(0, 0) scale(0.4); opacity: 1; }
            80%  { opacity: 1; }
            100% { transform: var(--spark-move) scale(0.9); opacity: 0; }
        }

        /* Eksplozja końcowa */
        body.explode {
            animation: flash 0.45s ease-in-out;
        }

        .explode .container {
            animation: blowUp 0.9s ease-out forwards;
        }

        .explode .snow,
        .explode .fireworks {
            animation: fadeAway 0.7s ease forwards;
        }

        @keyframes blowUp {
            0% { transform: translateY(0) scale(1); opacity: 1; filter: none; }
            40% { transform: translateY(-12px) scale(1.02) rotate(-1deg); filter: drop-shadow(0 12px 18px rgba(0,0,0,0.35)); }
            70% { transform: translateY(4px) scale(1.06) rotate(2deg); opacity: 0.5; }
            100% { transform: translateY(-60px) scale(1.2) rotate(-6deg); opacity: 0; filter: blur(4px); }
        }

        @keyframes fadeAway {
            from { opacity: 1; }
            to   { opacity: 0; }
        }

        @keyframes flash {
            0% { background-color: rgba(255,255,255,0); }
            30% { background-color: rgba(255,255,255,0.3); }
            100% { background-color: rgba(255,255,255,0); }
        }

        /* Ekran końcowy */
        .end-screen {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 40%, rgba(255,255,255,0.12), rgba(0,0,0,0.6));
            pointer-events: none;
            opacity: 0;
            animation: endFadeIn 1s ease forwards;
            z-index: 3;
        }

        .end-screen img {
            max-width: 70vw;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 18px 36px rgba(0,0,0,0.35);
            border: 4px solid rgba(255,255,255,0.8);
            background: rgba(255,255,255,0.08);
        }

        @keyframes endFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to   { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="snow snow--back"></div>
    <div class="snow snow--front"></div>
    <div class="fireworks" id="fireworks"></div>

    <div class="container">
        <h1>Czas do wysadzenia w powietrze Aleksa za zdrade zespołu</h1>
        
        <div class="photo-container">
            <img id="colleague-photo" src="img/photo1.jpg" alt="Kolega">
        </div>

        <div id="countdown">00:00:00:000</div>

        <div class="progress-container">
            <div class="progress-avatar" id="progress-avatar">
                <img id="progress-avatar-img" src="img/photo1.jpg" alt="Avatar">
            </div>
            <div id="progress-bar"></div>
            <div id="progress-text">0%</div>
        </div>

        <p class="info">Do 19 grudnia 2025, 15:30:00</p>
    </div>

    <script>
        // KONFIGURACJA
        const targetDate = new Date("December 19, 2025 15:30:00").getTime();
        // Ustaw datę początkową na jakąś datę w przeszłości, aby pasek postępu miał sens
        // Zmieniłem na 15.11.2025, 15:30 - czyli miesiąc do końca
        const startDate = new Date("December 15, 2025 11:15:00").getTime(); 
        
        const photoElement = document.getElementById('colleague-photo');
        const countdownElement = document.getElementById('countdown');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const progressAvatar = document.getElementById('progress-avatar');
        const progressAvatarImg = document.getElementById('progress-avatar-img');
        const fireworksContainer = document.getElementById('fireworks');
        const container = document.querySelector('.container');
        const snowLayers = document.querySelectorAll('.snow');

        // Pamiętamy ostatnią godzinę, dla której zmieniliśmy zdjęcie
        let lastPhotoHour = -1; 
        // Pamiętamy numer losowego zdjęcia, które obecnie wyświetlamy
        let currentPhotoIndex = 1;
        let exploded = false;

        // Funkcja wybierająca losową liczbę całkowitą z zakresu min do max (włącznie)
        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function update() {
            const now = new Date();
            const nowTime = now.getTime();
            const distance = targetDate - nowTime;

            if (distance < 0) {
                if (exploded) return;
                exploded = true;
                countdownElement.innerHTML = "00:00:00:000";
                progressBar.style.width = "100%";
                progressText.innerHTML = "WOLNOŚĆ!";
                photoElement.src = "img/freedom.jpg";
                progressAvatarImg.src = "img/freedom.jpg";

                document.body.classList.add('explode');

                setTimeout(() => {
                    container?.remove();
                    snowLayers.forEach(layer => layer.remove());
                    fireworksContainer?.remove();

                    const endScreen = document.createElement('div');
                    endScreen.className = 'end-screen';
                    const endImg = document.createElement('img');
                    endImg.src = 'img/harambe.png';
                    endImg.alt = 'Koniec';
                    endScreen.appendChild(endImg);
                    document.body.appendChild(endScreen);
                }, 900);
                return;
            }

            // 1. LICZNIK CZASU
            const hours = Math.floor(distance / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            // Milisekundy (pierwsze dwie cyfry)
            const milliseconds = Math.floor((distance % 1000) / 10);

            countdownElement.innerHTML = 
                String(hours).padStart(2, '0') + ":" + 
                String(minutes).padStart(2, '0') + ":" + 
                String(seconds).padStart(2, '0') + ":" + 
                String(milliseconds).padStart(2, '0');

            // 2. PASEK POSTĘPU
            const totalDuration = targetDate - startDate;
            const elapsed = nowTime - startDate;
            let progress = (elapsed / totalDuration) * 100;
            progress = Math.max(0, Math.min(100, progress)); 
            
            progressBar.style.width = progress + "%";
            progressText.innerHTML = progress.toFixed(1) + "%";
            progressAvatar.style.left = progress + "%";

            // 3. LOGIKA ZMIANY ZDJĘĆ CO GODZINĘ
            const currentHour = now.getHours();

            // Sprawdzamy, czy przeszła pełna godzina od ostatniej zmiany zdjęcia
            if (currentHour !== lastPhotoHour) {
                // Wybieramy LOSOWE zdjęcie z puli 1-15
                let newPhotoIndex = getRandomInt(1, 15);
                
                // Opcjonalnie: Unikaj dwukrotnego wylosowania tego samego zdjęcia pod rząd
                // while (newPhotoIndex === currentPhotoIndex) {
                //     newPhotoIndex = getRandomInt(1, 15);
                // }

                currentPhotoIndex = newPhotoIndex;
                lastPhotoHour = currentHour;

                // Ustawiamy nowe źródło zdjęcia
                const newSrc = `img/photo${currentPhotoIndex}.jpg`;
                photoElement.style.opacity = '0'; // Płynne wygaszenie
                
                setTimeout(() => {
                    photoElement.src = newSrc;
                    progressAvatarImg.src = newSrc;
                    photoElement.style.opacity = '1'; // Płynne pojawienie
                }, 300); // Czekamy 300ms na animację wygaszenia
            }
        }

        // Uruchamiamy funkcję odświeżającą co 50ms dla płynnego licznika
        setInterval(update, 50);
        
        // Wywołaj funkcję raz, aby ustawić początkowe wartości
        update();

        /* FAJERWERKI */
        const fireworkColors = ['#ffeb3b', '#ff4081', '#80d8ff', '#b388ff', '#ffab40', '#69f0ae'];

        function launchFirework() {
            const fw = document.createElement('div');
            fw.className = 'firework';
            const x = Math.random() * 80 + 10; // 10-90 vw
            const y = Math.random() * 40 + 10; // 10-50 vh
            fw.style.left = `${x}vw`;
            fw.style.top = `${y}vh`;

            const sparksCount = 18 + Math.floor(Math.random() * 10);
            const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];

            for (let i = 0; i < sparksCount; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.background = color;
                const angle = Math.random() * Math.PI * 2;
                const distance = 30 + Math.random() * 55; // px
                const dx = Math.cos(angle) * distance;
                const dy = Math.sin(angle) * distance;
                spark.style.setProperty('--spark-move', `translate(${dx}px, ${dy}px)`);
                spark.style.animationDelay = `${Math.random() * 150}ms`;
                fw.appendChild(spark);
            }

            fireworksContainer.appendChild(fw);

            setTimeout(() => {
                fw.remove();
            }, 1600);
        }

        // Start po chwili, potem co 30s
        setTimeout(() => {
            launchFirework();
            setInterval(launchFirework, 30000);
        }, 3000);
    </script>
</body>
</html>
